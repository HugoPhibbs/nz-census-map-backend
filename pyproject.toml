[project]
name = "nz-census-map-backend"
version = "0.1.0"
description = "Backend API for the NZ Census Map project"
readme = "README.md"
authors = [
    { name = "Hugo Phibbs", email = "hugophibbs1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cachetools>=7.2.0",
    "flask>=3.1.3",
    "flask-caching>=2.5.1",
    "flask-cors>=6.0.5",
    "google-auth>=2.58.0",
    "google-cloud-storage>=3.14.1",
    "gunicorn>=26.2.0",
    "psycopg-pool>=3.3.2",
    "psycopg[binary]>=3.3.6",
    "pypika>=0.51.1",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "waitress>=3.0.2",
]

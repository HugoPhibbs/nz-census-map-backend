[project]
name = "nz-census-map-backend"
version = "0.1.0"
description = "Backend API for the NZ Census Map project"
readme = "README.md"
authors = [
    { name = "Hugo Phibbs", email = "hugophibbs1@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.8.0",
    "brotli>=1.2.0",
    "fastparquet>=2026.5.0",
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "flask-json>=0.4.0",
    "flask-limiter[redis]>=4.1.1",
    "flask-orjson>=2.0.0",
    "gunicorn>=26.2.0",
    "mcp[cli]>=2.2.0",
    "psycopg-pool>=3.3.2",
    "psycopg[binary]>=3.3.6",
    "pypika>=0.51.1",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "waitress>=3.0.2",
    "requests>=2.34.2",
]

[tool.ruff.lint]
extend-ignore = ["SIM117"]

name: Google Cloud Run Deploy
# Useful for GCP auth gates: https://docs.cloud.google.com/run/docs/reference/iam/roles

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'
          
      - uses: google-github-actions/setup-gcloud@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install python-dotenv

      - name: Deploy
        env:
          DB_CONNECTION_STRING_PROD: ${{ secrets.DB_CONNECTION_STRING_PROD }}
          STATS_NZ_API_KEY: ${{ secrets.STATS_NZ_API_KEY }}
          BEARER_TOKEN: ${{ secrets.BEARER_TOKEN }}
          BUCKET_NAME: ${{ vars.BUCKET_NAME }}
          FRONTEND_DOMAIN: ${{ vars.FRONTEND_DOMAIN }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          API_SA_NAME: ${{ vars.API_SA_NAME }}
          PROJECT_ID: ${{ vars.PROJECT_ID }}
        run: python deploy.py -dcr

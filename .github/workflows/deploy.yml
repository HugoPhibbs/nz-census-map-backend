name: Google Cloud Run Deploy

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"
      - "docs/**"

  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"
      - "docs/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env: 
      DB_CONNECTION_STRING_PROD: ${{ secrets.DB_CONNECTION_STRING_PROD }}
      STATS_NZ_API_KEY: ${{ secrets.STATS_NZ_API_KEY }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      BUCKET_NAME: ${{ vars.BUCKET_NAME }}
      FIREBASE_HOSTSITE_ID: ${{ vars.FIREBASE_HOSTSITE_ID }}
      FRONTEND_DOMAIN: ${{ vars.FRONTEND_DOMAIN }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      API_SA_NAME: ${{ vars.API_SA_NAME }}
      PROJECT_ID: ${{ vars.PROJECT_ID }}
      CLOUD_RUN_SERVICE_NAME: ${{ vars.CLOUD_RUN_SERVICE_NAME }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'
          
      - uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
        
      - run: pip install python-dotenv requests
    
      - name: Terraform plan
        if: github.event_name == 'pull_request'
        run: python deploy.py --tf-init --tf-plan --no-input

      - name: Deploy
        if: github.event_name == 'push'
        run: python deploy.py --tf-all --update-api --no-input

      - name: API Health Check
        if: github.event_name == 'push'
        run:
            curl --fail --retry 5 --retry-all-errors --retry-delay 2 ${{ vars.CLOUD_RUN_API_URL }}/health

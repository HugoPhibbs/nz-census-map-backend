name: Deployment

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"
      - "docs/**"

  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"
      - "docs/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'
          
      - uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
        
      - run: pip install python-dotenv requests
    
      - name: Terraform plan
        if: github.event_name == 'pull_request'
        run: python deploy.py --tf-init --tf-plan --no-input

      - name: Terraform init and apply
        if: github.event_name == 'push'
        run: python deploy.py --tf-init-apply --no-input

      - name: Update API (Cloud Run)
        if : github.event_name == 'push'
        run: python deploy.py --update-api --no-input

      - name: API Health Check
        if: github.event_name == 'push'
        run:
            curl --fail --retry 5 --retry-all-errors --retry-delay 2 ${{ vars.CLOUD_RUN_API_URL }}/health

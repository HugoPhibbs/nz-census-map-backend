name: Tests

on:
  push: &trigger # Yaml anchor
    branches: [ "main" ]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request: *trigger


jobs:
  # Just check that the container boots up and connects to dummy SQL and Redis DBs
  docker-api-build-and-serve:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
    
      - name: API Build
        run: docker build -t api:latest .

      - name: API Serve (run container)

        run: >
          docker run -d --network host
          -e DB_HOST=localhost -e DB_NAME=postgres -e DB_USER=postgres -e DB_PASSWORD=password
          -e REDIS_HOST=localhost -e REDIS_PASSWORD=""
          -e FRONTEND_DOMAIN=https://nz-census-map.com
          api:latest api

      - name: API Health Check
        # Check health, retry up to 5 times with 2 second delay if connection refused
        run:
            curl --fail --retry 5 --retry-all-errors --retry-delay 2 http://localhost:8080/health
    
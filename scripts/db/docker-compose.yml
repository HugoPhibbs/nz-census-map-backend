services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: census-db
      POSTGRES_PASSWORD: devpassword
      POSTGRES_USER: admin
    ports:
      - "5432:5432"
    volumes:
      - ./create_tables.sql:/docker-entrypoint-initdb.d/01-create_tables.sql
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: